<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Three.js WebXR Hit Test</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
  </style>

  <!-- Import maps polyfill for older browsers -->
  <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

  <!-- Define where to pull Three.js from -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<script type="module">
  import * as THREE from 'three';
  import { ARButton } from 'three/addons/webxr/ARButton.js';

  let camera, scene, renderer;
  let controller;
  let reticle;

  let hitTestSource = null;
  let hitTestSourceRequested = false;

  init();
  animate();

  function init() {
    // 1. Setup Scene and Camera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    // 2. Setup Lighting so the 3D objects aren't pitch black
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    // 3. Setup WebGL Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true; // IMPORTANT: Turn on WebXR
    document.body.appendChild(renderer.domElement);

    // 4. Add the AR Button with the "hit-test" feature requested
    document.body.appendChild(
      ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] })
    );

    // 5. Setup the Controller (Handles screen taps)
    controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelect);
    scene.add(controller);

    // 6. Setup the Reticle (The targeting ring on the floor)
    const reticleGeometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
    const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
    
    // The reticle handles its own tracking matrix, so we don't want Three.js overriding it
    reticle.matrixAutoUpdate = false; 
    reticle.visible = false;
    scene.add(reticle);

    // Handle window resizing
    window.addEventListener('resize', onWindowResize);
  }

  // 7. Function to place an object when the screen is tapped
  function onSelect() {
    // Only place an object if the reticle is currently showing on a surface
    if (reticle.visible) {
      // Create a small colorful cube
      const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
      const material = new THREE.MeshPhongMaterial({ color: 0xffffff * Math.random() });
      const mesh = new THREE.Mesh(geometry, material);

      // Set the cube's position and rotation to match the reticle on the floor
      mesh.position.setFromMatrixPosition(reticle.matrix);
      mesh.quaternion.setFromRotationMatrix(reticle.matrix);
      
      // Bump the cube up slightly so it sits ON the floor, not halfway through it
      mesh.position.y += 0.05; 

      scene.add(mesh);
    }
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // 8. The Animation Loop (Runs every frame)
  function animate() {
    renderer.setAnimationLoop(render);
  }

  function render(timestamp, frame) {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      // Request a Hit Test Source on the first frame
      if (hitTestSourceRequested === false) {
        session.requestReferenceSpace('viewer').then(function (referenceSpace) {
          session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
            hitTestSource = source;
          });
        });
        session.addEventListener('end', function () {
          hitTestSourceRequested = false;
          hitTestSource = null;
        });
        hitTestSourceRequested = true;
      }

      // If we have a hit test source, check if the camera is pointing at the floor
      if (hitTestSource) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);

        if (hitTestResults.length > 0) {
          // If we found a surface, get its coordinates
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);

          // Show the reticle and move it to the floor coordinates
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          // Hide the reticle if we aren't pointing at a flat surface
          reticle.visible = false;
        }
      }
    }

    renderer.render(scene, camera);
  }
</script>
</body>
</html>
